<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Asmeret Teklu — Software Engineer, AI and Full-Stack Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D12"/>
      <stop offset="0.6" stop-color="#15151E"/>
      <stop offset="1" stop-color="#1E1E2A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#E0A387" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E0A387" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0A387" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0A387"/>
      <stop offset="1" stop-color="#E0A387" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#E0A387" stroke-opacity="0.25"/>
  <!-- decorative rings -->
  <circle cx="1060" cy="70" r="150" fill="none" stroke="#E0A387" stroke-opacity="0.10"/>
  <circle cx="1060" cy="70" r="105" fill="none" stroke="#C9A96E" stroke-opacity="0.14"/>
  <circle cx="1060" cy="70" r="60" fill="none" stroke="#E0A387" stroke-opacity="0.18"/>
  <text x="600" y="92" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="7" fill="#E0A387">SOFTWARE ENGINEER  ·  AI  ·  FULL-STACK</text>
  <text x="600" y="172" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-size="82" font-weight="500" fill="#F5EBE0">Asmeret Teklu</text>
  <rect x="440" y="196" width="320" height="1.5" fill="url(#line)"/>
  <text x="600" y="236" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#C9A96E">Building useful software from Mekelle, Ethiopia</text>
  <text x="600" y="266" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#888891">AIMING FOR A FULLY FUNDED MSc</text>
